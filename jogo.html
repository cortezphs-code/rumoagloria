/* ============================== HELPERS ============================== */

/* RNG com seed opcional — usado pelo Desafio do Dia pra dar o mesmo sorteio pra todo mundo */
const RNG = { fn: Math.random };

function rnd() { return RNG.fn(); }

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function seedFromString(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}

function dataDeHoje() {
  return new Date().toISOString().slice(0, 10);
}

function ativarRngDoDia() { RNG.fn = mulberry32(seedFromString(dataDeHoje())); }
function ativarRngNormal() { RNG.fn = Math.random; }

function getNomeClube(chaveComAno) {
  return chaveComAno.replace(/\s\d{4}$/, "");
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function poisson(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= rnd(); } while (p > L);
  return k - 1;
}

function golsEsperados(atk, def) {
  const diff = atk - def;
  return Math.max(0.15, 1.35 + diff / 22);
}

function simularPartida(timeA, timeB) {
  const golsA = poisson(golsEsperados(timeA.ataque, timeB.defesa));
  const golsB = poisson(golsEsperados(timeB.ataque, timeA.defesa));
  return { golsA, golsB };
}

function sortearArtilheiros(squad, nGols) {
  const candidatos = [...squad.FW, ...squad.MF];
  if (candidatos.length === 0) return [];
  const pesoTotal = candidatos.reduce((s, j) => s + j.overall, 0);
  const eventos = [];
  for (let i = 0; i < nGols; i++) {
    let r = rnd() * pesoTotal;
    let escolhido = candidatos[candidatos.length - 1];
    for (const c of candidatos) {
      if (r < c.overall) { escolhido = c; break; }
      r -= c.overall;
    }
    eventos.push(escolhido.nome);
  }
  return eventos;
}

function calcularMVP(eventosLadoA, squadA) {
  const contagem = {};
  eventosLadoA.forEach(e => { if (e.jogador) contagem[e.jogador] = (contagem[e.jogador] || 0) + 1; });
  const nomes = Object.keys(contagem);
  if (nomes.length > 0) {
    nomes.sort((a, b) => contagem[b] - contagem[a]);
    const gols = contagem[nomes[0]];
    return { nome: nomes[0], motivo: gols > 1 ? `${gols} gols na partida` : "Gol decisivo" };
  }
  const todos = [...squadA.GK, ...squadA.DF, ...squadA.MF, ...squadA.FW];
  if (todos.length === 0) return null;
  const melhor = todos.reduce((m, j) => (j.overall > m.overall ? j : m), todos[0]);
  return { nome: melhor.nome, motivo: "Destaque em campo" };
}


function gerarEventosPartida(golsA, golsB, squadA, squadB) {
  const minutosUsados = new Set();
  function minutoLivre() {
    let m;
    do { m = 1 + Math.floor(rnd() * 90); } while (minutosUsados.has(m));
    minutosUsados.add(m);
    return m;
  }
  const artilheirosA = golsA > 0 ? sortearArtilheiros(squadA, golsA) : [];
  const artilheirosB = squadB && golsB > 0 ? sortearArtilheiros(squadB, golsB) : [];
  const eventos = [];
  for (let i = 0; i < golsA; i++) eventos.push({ minuto: minutoLivre(), lado: "A", jogador: artilheirosA[i] });
  for (let i = 0; i < golsB; i++) eventos.push({ minuto: minutoLivre(), lado: "B", jogador: artilheirosB[i] || null });
  eventos.sort((a, b) => a.minuto - b.minuto);
  return eventos;
}

function penaltis(forcaA, forcaB) {
  let a = 0, b = 0;
  const probA = Math.min(0.92, Math.max(0.45, 0.75 + (forcaA - forcaB) / 300));
  const probB = Math.min(0.92, Math.max(0.45, 0.75 + (forcaB - forcaA) / 300));
  for (let i = 0; i < 5; i++) {
    if (rnd() < probA) a++;
    if (rnd() < probB) b++;
  }
  while (a === b) {
    if (rnd() < probA) a++; else b++;
    if (a === b && rnd() < probB) b++;
  }
  return { a, b };
}

function calcularForcaSquad(squad) {
  const media = (arr) => arr.length ? arr.reduce((s, j) => s + j.overall, 0) / arr.length : 60;
  const avgFW = media(squad.FW);
  const avgMF = media(squad.MF);
  const avgDF = media(squad.DF);
  const avgGK = squad.GK[0] ? squad.GK[0].overall : 60;

  const origens = [...squad.GK, ...squad.DF, ...squad.MF, ...squad.FW].map(j => getNomeClube(j.origem));
  const fatores = origens.map(nome => {
    const clube = TIMES_HISTORICOS.find(t => t.nome === nome);
    return clube ? clube.fatorHistorico : 70;
  });
  const avgFator = fatores.reduce((s, f) => s + f, 0) / fatores.length;
  const multiplicador = 1 + (avgFator - 75) / 500;

  const ataqueRaw = avgFW * 0.65 + avgMF * 0.35;
  const defesaRaw = avgDF * 0.7 + avgGK * 0.3;

  const todos = [...squad.GK, ...squad.DF, ...squad.MF, ...squad.FW];
  const overallMedio = todos.reduce((s, j) => s + j.overall, 0) / todos.length;

  return {
    ataque: Math.round(ataqueRaw * multiplicador),
    defesa: Math.round(defesaRaw * multiplicador),
    overallMedio: Math.round(overallMedio * 10) / 10,
    fatorTradicao: Math.round(avgFator),
  };
}

function poolOponentes(modoCompeticao) {
  if (modoCompeticao === "2026") {
    return TIMES_ATUAIS.map(t => ({ nome: t.nome, ataque: t.ataque, defesa: t.defesa }));
  }
  return TIMES_HISTORICOS.map(t => ({
    nome: ANO_HISTORICO[t.nome] ? `${t.nome} ${ANO_HISTORICO[t.nome]}` : t.nome,
    ataque: t.ataque, defesa: t.defesa,
  }));
}

function sortearAdversarioKnockout(modoCompeticao, rodadaIdx, jaEnfrentados) {
  const pool = poolOponentes(modoCompeticao);
  const disponiveis = pool.filter(t => !jaEnfrentados.includes(t.nome));
  const ordenado = [...disponiveis].sort((a, b) => (b.ataque + b.defesa) - (a.ataque + a.defesa));
  const cortesPct = [1, 0.6, 0.35, 0.15];
  const corte = Math.max(3, Math.ceil(disponiveis.length * cortesPct[Math.min(rodadaIdx, 3)]));
  const candidatos = ordenado.slice(0, corte);
  return candidatos[Math.floor(rnd() * candidatos.length)];
}

function novaTabela(nomes) {
  const t = {};
  nomes.forEach(n => { t[n] = { nome: n, pontos: 0, jogos: 0, golsPro: 0, golsContra: 0 }; });
  return t;
}

function aplicarResultado(tabela, a, b, golsA, golsB) {
  tabela[a].jogos++; tabela[b].jogos++;
  tabela[a].golsPro += golsA; tabela[a].golsContra += golsB;
  tabela[b].golsPro += golsB; tabela[b].golsContra += golsA;
  if (golsA > golsB) tabela[a].pontos += 3;
  else if (golsA < golsB) tabela[b].pontos += 3;
  else { tabela[a].pontos += 1; tabela[b].pontos += 1; }
}

function ordenarTabela(tabela) {
  return Object.values(tabela).sort((x, y) =>
    y.pontos - x.pontos ||
    (y.golsPro - y.golsContra) - (x.golsPro - x.golsContra) ||
    y.golsPro - x.golsPro
  );
}

function todosConfrontos(nomes) {
  const jogos = [];
  for (let i = 0; i < nomes.length; i++) {
    for (let j = i + 1; j < nomes.length; j++) jogos.push([nomes[i], nomes[j]]);
  }
  return jogos;
}

/* ---------- PONTUAÇÃO DE CAMPANHA ---------- */

const PESO_FASE = { "Fase de Grupos": 0, "Oitavas": 15, "Quartas": 30, "Semifinal": 50, "Final": 75 };

function calcularPontuacaoCampanha({ campeao, faseEliminacao, golsCampanha, modo }) {
  const base = campeao ? 120 : (PESO_FASE[faseEliminacao] ?? 0);
  const bonusGols = golsCampanha * 2;
  const bonusModo = modo === "lendario" ? 1.25 : 1;
  return Math.round((base + bonusGols) * bonusModo);
}

function maiorGrupoDeClube(squad) {
  const contagem = {};
  [...squad.GK, ...squad.DF, ...squad.MF, ...squad.FW].forEach(j => {
    const clube = getNomeClube(j.origem);
    contagem[clube] = (contagem[clube] || 0) + 1;
  });
  return Math.max(0, ...Object.values(contagem));
}

/* ---------- STREAK (sequência de títulos, salva localmente) ---------- */

async function carregarStreak() {
  try {
    const v = localStorage.getItem("libertadores:streak-campeao");
    return v ? JSON.parse(v) : { atual: 0, recorde: 0 };
  } catch (e) {
    return { atual: 0, recorde: 0 };
  }
}

async function salvarStreak(campeao) {
  try {
    const atual = await carregarStreak();
    const novoAtual = campeao ? atual.atual + 1 : 0;
    const novo = { atual: novoAtual, recorde: Math.max(atual.recorde, novoAtual) };
    localStorage.setItem("libertadores:streak-campeao", JSON.stringify(novo));
    return novo;
  } catch (e) {
    return { atual: 0, recorde: 0 };
  }
}

/* ---------- CARD DE RESULTADO (estilo Wordle, pra compartilhar) ---------- */

function gerarTextoCompartilhavel({ nomeTime, campeao, faseEliminacao, historicoResultados, pontos, modo, modoCompeticao }) {
  const emoji = { V: "🟩", D: "🟥", E: "🟨", P: "🟦" };
  const linha = historicoResultados.map(r => emoji[r] || "⬜").join(" ");
  const modoTxt = modo === "lendario" ? "Modo Lendário" : "Modo Normal";
  const compTxt = modoCompeticao === "2026" ? "Libertadores 2026" : "Libertadores Histórica";
  const resultadoTxt = campeao ? "🏆 CAMPEÃO" : `Eliminado na ${faseEliminacao}`;
  return `⚽ Rumo à Glória — ${nomeTime}\n${compTxt} · ${modoTxt}\n${linha}\n${resultadoTxt} · ${pontos} pontos`;
}

  return CORES_CLUBES[base] || ["#5a5a5a", "#8a8a8a"];
}

/* Troféu genérico (taça estilizada, não é reprodução de nenhum troféu real) */

  return (
    <svg viewBox="0 0 200 240" width={tamanho} height={tamanho * 1.2} style={{ margin: "0 auto", display: "block" }}>
      <defs>
        <linearGradient id="tro-gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#fbe3a1" />
          <stop offset="45%" stopColor="#e0b13c" />
          <stop offset="100%" stopColor="#9c7423" />
        </linearGradient>
      </defs>
      <circle cx="100" cy="10" r="8" fill="url(#tro-gold)" />
      <path d="M55 45 L15 55 L20 95 L58 112" fill="none" stroke="url(#tro-gold)" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M145 45 L185 55 L180 95 L142 112" fill="none" stroke="url(#tro-gold)" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M52 38 L100 20 L148 38 L142 88 L100 150 L58 88 Z" fill="url(#tro-gold)" />
      <path d="M52 38 L100 55 L148 38" fill="none" stroke="#fbe3a1" strokeWidth="3" opacity="0.5" />
      <rect x="92" y="150" width="16" height="48" fill="url(#tro-gold)" />
      <rect x="75" y="196" width="50" height="18" rx="2" fill="url(#tro-gold)" />
      <rect x="55" y="212" width="90" height="16" rx="2" fill="url(#tro-gold)" />
    </svg>
  );
}

/* Bola bicolor com as cores reais do clube — usada pra representar os adversários */
function BolaClube({ nome, tamanho = 48 }) {
  const [c1, c2] = corDoClube(nome);
  return (
    <div style={{
      width: tamanho, height: tamanho, borderRadius: "50%", flexShrink: 0,
      background: `conic-gradient(from 90deg, ${c1} 0deg 180deg, ${c2} 180deg 360deg)`,
      boxShadow: "0 2px 6px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.35), inset 0 -3px 5px rgba(0,0,0,.35)",
      border: "1px solid rgba(255,255,255,.15)",
    }} />
  );
}

function Badge({ children, tone = "neutral" }) {
  const tones = {
    neutral: "bg-white/10 text-white/70",
    open: "bg-emerald-500/20 text-emerald-300",
    full: "bg-white/5 text-white/25",
  };
  return <span className={`text-[10px] font-bold tracking-wide px-1.5 py-0.5 rounded ${tones[tone]}`}>{children}</span>;
}

function CartaJogador({ jogador, disabled, onClick, mostrarOverall }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      className={`carta-jogador text-left w-full rounded-xl p-3 border transition-all duration-150 ${
        disabled
          ? "opacity-30 cursor-not-allowed border-white/5 bg-white/[0.02]"
          : "border-white/10 bg-white/[0.04] hover:border-white/30 hover:bg-white/[0.08] hover:-translate-y-0.5 cursor-pointer"
      }`}
      style={!disabled ? { borderColor: "rgba(224,177,60,.25)" } : undefined}
    >
      <div className="flex items-center justify-between mb-2">
        <Badge tone={disabled ? "full" : "open"}>{jogador.posicao}</Badge>
        {mostrarOverall && <span className="numero text-xl leading-none" style={{ color: ACCENT }}>{jogador.overall}</span>}
      </div>
      <div className="font-semibold text-sm text-white/90 leading-tight">{jogador.nome}</div>
    </button>
  );
}

function MiniProgresso({ squad, formacao }) {
  const linhas = [{ pos: "GK", max: 1 }, { pos: "DF", max: formacao.DF }, { pos: "MF", max: formacao.MF }, { pos: "FW", max: formacao.FW }];
  return (
    <div className="flex gap-4 justify-center flex-wrap">
      {linhas.map(l => (
        <div key={l.pos} className="flex items-center gap-1.5">
          <span className="text-[10px] font-bold text-white/40 w-6">{l.pos}</span>
          <div className="flex gap-1">
            {Array.from({ length: l.max }).map((_, i) => (
              <div key={i} className="w-2.5 h-2.5 rounded-full border border-white/20" style={{ background: i < squad[l.pos].length ? ACCENT : "transparent" }} />
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ====================== PARTIDA AO VIVO (relógio ultra-rápido) ====================== */

function PartidaAoVivo({ nomeTime, adversarioNome, adversarioEhJogador, squadA, golsA, golsB, eventos, pen, onContinuar }) {
  const [minuto, setMinuto] = useState(0);
  const [placarA, setPlacarA] = useState(0);
  const [placarB, setPlacarB] = useState(0);
  const [log, setLog] = useState([]);
  const [etapa, setEtapa] = useState("rolando"); // rolando | penaltis | fim

  useEffect(() => {
    let cancelado = false;
    let m = 0;
    const revelados = new Set();

    function tick() {
      if (cancelado) return;
      m += 2;
      if (m > 90) m = 90;
      setMinuto(m);

      eventos.forEach((ev, i) => {
        if (ev.minuto <= m && !revelados.has(i)) {
          revelados.add(i);
          if (ev.lado === "A") setPlacarA(p => p + 1);
          else setPlacarB(p => p + 1);
          setLog(l => [...l, ev]);
        }
      });

      if (m < 90) {
        setTimeout(tick, 45);
      } else {
        if (pen) {
          setTimeout(() => setEtapa("penaltis"), 500);
          setTimeout(() => setEtapa("fim"), 1400);
        } else {
          setTimeout(() => setEtapa("fim"), 500);
        }
      }
    }
    const t0 = setTimeout(tick, 250);
    return () => { cancelado = true; clearTimeout(t0); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <div className="animate-[cartaIn_.3s_ease] text-center py-6">
      <div className="flex items-center justify-center gap-3 mb-8">
        <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse" />
        <span className="numero text-lg text-white/70">{etapa === "rolando" ? `${minuto}'` : etapa === "penaltis" ? "Pênaltis" : "Fim de jogo"}</span>
      </div>

      <div className="flex items-center justify-center gap-8 mb-8">
        <div className="flex flex-col items-center gap-3">
          <Monograma nome={nomeTime} tamanho={56} />
          <span className="text-white/80 text-sm font-semibold max-w-[110px] leading-tight">{nomeTime}</span>
        </div>
        <div className="flex items-center gap-4">
          <span className="numero text-6xl text-white">{placarA}</span>
          <span className="numero text-3xl text-white/20">-</span>
          <span className="numero text-6xl text-white">{placarB}</span>
        </div>
        <div className="flex flex-col items-center gap-3">
          {adversarioEhJogador ? <Monograma nome={adversarioNome} tamanho={56} /> : <BolaClube nome={adversarioNome} tamanho={56} />}
          <span className="text-white/80 text-sm font-semibold max-w-[110px] leading-tight">{adversarioNome}</span>
        </div>
      </div>

      {etapa === "penaltis" && (
        <div className="text-white/50 text-sm mb-4">Vai para os pênaltis...</div>
      )}

      {etapa === "fim" && (
        <div className="animate-[cartaIn_.3s_ease]">
          {pen && <div className="text-white/50 text-sm mb-2">Pênaltis: {pen.a} x {pen.b}</div>}
          {log.filter(e => e.lado === "A" && e.jogador).length > 0 && (
            <div className="text-white/50 text-sm mb-1">{nomeTime}: {log.filter(e => e.lado === "A" && e.jogador).map(e => `${e.jogador} (${e.minuto}')`).join(", ")}</div>
          )}
          {adversarioEhJogador && log.filter(e => e.lado === "B" && e.jogador).length > 0 && (
            <div className="text-white/50 text-sm mb-6">{adversarioNome}: {log.filter(e => e.lado === "B" && e.jogador).map(e => `${e.jogador} (${e.minuto}')`).join(", ")}</div>
          )}
          {!adversarioEhJogador && squadA && (() => {
            const mvp = calcularMVP(log.filter(e => e.lado === "A"), squadA);
            return mvp ? (
              <div className="inline-block mb-6 px-4 py-2 rounded-xl animate-[cartaIn_.4s_ease]" style={{ background: `${ACCENT}18`, border: `1px solid ${ACCENT}55` }}>
                <div className="text-[10px] uppercase tracking-wider" style={{ color: ACCENT }}>⭐ MVP da Partida</div>
                <div className="font-bold text-white text-sm">{mvp.nome}</div>
                <div className="text-white/40 text-[11px]">{mvp.motivo}</div>
              </div>
            ) : null;
          })()}
          <button onClick={() => onContinuar({ golsA, golsB, pen })} className="px-10 py-4 rounded-xl font-bold text-black text-lg" style={{ background: ACCENT }}>
            Continuar
          </button>
        </div>
      )}

      {etapa !== "fim" && log.length > 0 && (
        <div className="text-white/30 text-xs mt-4">
          {log[log.length - 1].lado === "A" ? `GOOOL do ${nomeTime}!` : adversarioEhJogador ? `Gol do ${adversarioNome}!` : "Gol do adversário"} ({log[log.length - 1].minuto}')
        </div>
      )}
    </div>
  );
}

function TelaDraft({ modo, timeAtual, squad, formacao, rerolls, rodada, totalVagas, vagaAberta, onEscolher, onResortear }) {
  const ano = useMemo(() => { const m = timeAtual.time.match(/(\d{4})$/); return m ? m[1] : ""; }, [timeAtual]);
  const nomeClube = timeAtual.time.replace(/\s\d{4}$/, "");
  const totalFeito = squad.GK.length + squad.DF.length + squad.MF.length + squad.FW.length;

  return (
    <div key={timeAtual.time} className="animate-[cartaIn_.3s_ease]">
      <div className="flex items-center justify-between mb-6">
        <div>
          <div className="text-xs text-white/40 uppercase tracking-wider">Rodada {rodada} · Elenco de origem (escolha 1 jogador)</div>
          <div className="titulo text-2xl text-white">{nomeClube} <span style={{ color: ACCENT }}>{ano}</span></div>
        </div>
        <button onClick={onResortear} disabled={rerolls <= 0}
          className={`px-4 py-2 rounded-lg border text-sm font-bold transition-colors ${rerolls > 0 ? "border-white/20 text-white/80 hover:border-white/40" : "border-white/5 text-white/20 cursor-not-allowed"}`}>
          Sortear Novamente ({rerolls}/3)
        </button>
      </div>

      <div className="mb-6"><MiniProgresso squad={squad} formacao={formacao} /></div>

      <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">
        {timeAtual.jogadores.map((j, i) => (
          <div key={j.nome + i} style={{ animationDelay: `${i * 40}ms` }}>
            <CartaJogador jogador={j} disabled={!vagaAberta(squad, j.posicao)} mostrarOverall={modo === "normal"} onClick={() => onEscolher(j)} />
          </div>
        ))}
      </div>

      <div className="text-center text-white/30 text-xs mt-6">{totalFeito}/{totalVagas} vagas preenchidas</div>
    </div>
  );
}

function TelaGrupo({ nomeTime, modoCompeticao, grupoOponentes, tabela, pendentes, onJogar, onAvancar }) {

  const todosJogados = pendentes.length === 0;

  const voltasFeitas = 3 - pendentes.filter(p => p.perna === "Volta").length;

  return (
    <div className="animate-[cartaIn_.4s_ease]">
      <div className="text-center mb-6">
        <div className="text-xs uppercase tracking-wider text-white/40">Fase de Grupos</div>
        <h2 className="titulo text-3xl text-white">Seu Grupo</h2>
        <div className="inline-block mt-2 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider" style={{ background: `${ACCENT}22`, color: ACCENT }}>
          Adversários: {modoCompeticao === "2026" ? "Libertadores 2026" : "Libertadores Histórica"}
        </div>
      </div>

      {!todosJogados && (
        <div className="mb-6">
          <div className="flex justify-center gap-8 mb-6">
            <div className="text-center">

              <div className="text-[10px] uppercase text-white/40">Jogos de ida</div>
            </div>
            <div className="text-center">
              <div className="numero text-2xl" style={{ color: !restamIdas ? ACCENT : "rgba(255,255,255,.2)" }}>{voltasFeitas}/3</div>
              <div className="text-[10px] uppercase text-white/40">Jogos de volta</div>
            </div>
          </div>
          <div className="text-center text-white/30 text-xs mb-4">A classificação só é revelada depois da última partida</div>

          <div className="space-y-2">
            {pendentes.map(p => {
              const habilitado = p.perna === "Ida" || !restamIdas;
              return (
                <button key={p.id} onClick={() => habilitado && onJogar(p)} disabled={!habilitado}
                  className={`w-full flex items-center justify-between border rounded-lg px-4 py-3 transition-colors ${
                    habilitado ? "bg-white/5 hover:bg-white/10 border-white/10 cursor-pointer" : "bg-white/[0.02] border-white/5 opacity-40 cursor-not-allowed"
                  }`}>

      {todosJogados && (
        <div className="animate-[cartaIn_.4s_ease]">
          <div className="text-center text-xs uppercase tracking-wider text-white/40 mb-3">Classificação final do grupo</div>
          <div className="rounded-xl overflow-hidden border border-white/10 mb-6">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-white/5 text-white/40 text-[10px] uppercase">
                  <th className="text-left py-2 px-3">Time</th>
                  <th className="py-2 px-2">P</th>
                  <th className="py-2 px-2">J</th>

              </thead>

                {ordenada.map((t, i) => (

function TelaFinal({ nomeTime, status, faseEliminacao, golsCampanha, golsSofridosCampanha, usouPenaltis, margemMaxima, fechou7x0, historicoResultados, rerolls, squad, modo, modoJogo, modoCompeticao, onReiniciar }) {
  const campeao = status === "campeao";
  const pontos = calcularPontuacaoCampanha({ campeao, faseEliminacao, golsCampanha, modo });
  const chave = modoJogo === "desafio" ? chaveRankingDia() : CHAVE_RANKING_GERAL;
  const ehDupla = modoJogo === "dupla";

  const [apelido, setApelido] = useState(nomeTime);
  const [salvando, setSalvando] = useState(false);
  const [salvo, setSalvo] = useState(false);
  const [ranking, setRanking] = useState(null);
  const [carregando, setCarregando] = useState(true);
  const [conquistasNovas, setConquistasNovas] = useState([]);
  const [streak, setStreak] = useState(null);
  const [copiado, setCopiado] = useState(false);

  useEffect(() => {
    let ativo = true;
    if (!ehDupla) {
      carregarRanking(chave).then(r => { if (ativo) { setRanking(r); setCarregando(false); } });

      const stats = {
        campeao, modo, golsSofridos: golsSofridosCampanha, usouPenaltis, margemMaxima, fechou7x0,
        resorteiosUsados: 3 - rerolls, maiorGrupoClube: maiorGrupoDeClube(squad),
      };
      const conquistadasAgora = avaliarConquistas(stats);
      carregarConquistas().then(async antigas => {
        if (!ativo) return;
        const novas = conquistadasAgora.filter(id => !antigas.includes(id));
        setConquistasNovas(novas);
        if (novas.length > 0) await salvarConquistas([...antigas, ...novas]);
      });

      salvarStreak(campeao).then(s => { if (ativo) setStreak(s); });
    }
    return () => { ativo = false; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  async function salvar() {
    setSalvando(true);
    const novo = await salvarNoRanking(chave, { nome: apelido.trim() || nomeTime, pontos, fase: campeao ? "Campeão" : faseEliminacao, data: dataDeHoje() });
    setSalvando(false);
    if (novo) { setRanking(novo); setSalvo(true); }
  }

  async function compartilhar() {
    const texto = gerarTextoCompartilhavel({ nomeTime, campeao, faseEliminacao, historicoResultados, pontos, modo, modoCompeticao });
    try {
      await navigator.clipboard.writeText(texto);
      setCopiado(true);
      setTimeout(() => setCopiado(false), 2000);
    } catch (e) { /* clipboard indisponível, ignora silenciosamente */ }
  }

  return (
    <div className="animate-[cartaIn_.5s_ease] text-center py-10">
      {campeao ? (
        <div className="mb-6 drop-shadow-[0_0_30px_rgba(224,177,60,.5)]">
          <TrofeuGenerico tamanho={170} />
        </div>
      ) : (
        <div className="text-7xl mb-6">⚽</div>
      )}
      <div className="flex justify-center mb-4"><Monograma nome={nomeTime} tamanho={56} /></div>
      <h2 className="titulo text-4xl text-white mb-3">{nomeTime}</h2>
      {campeao ? (
        <p className="text-lg font-bold mb-2" style={{ color: ACCENT }}>
          Parabéns, você ganhou a Taça Libertadores{modoCompeticao === "2026" ? " 2026" : ""}!
        </p>
      ) : (
        <p className="text-white/50 mb-2">Eliminado na {faseEliminacao}</p>
      )}

      {!ehDupla && <div className="numero text-4xl text-white mb-2">{pontos} <span className="text-sm text-white/40 font-normal">pontos</span></div>}

      {!ehDupla && historicoResultados.length > 0 && (
        <div className="text-xl mb-2 tracking-wider">
          {historicoResultados.map((r, i) => <span key={i}>{{ V: "🟩", D: "🟥", E: "🟨", P: "🟦" }[r]}</span>)}
        </div>
      )}

      {!ehDupla && streak && streak.atual > 0 && (
        <div className="text-white/40 text-xs mb-6">🔥 Sequência atual: {streak.atual} título{streak.atual > 1 ? "s" : ""} seguido{streak.atual > 1 ? "s" : ""} · Recorde: {streak.recorde}</div>
      )}

      {!ehDupla && (
        <button onClick={compartilhar} className="mb-8 px-6 py-2.5 rounded-xl border border-white/15 text-white/80 text-sm font-bold hover:border-white/30 transition-colors">
          {copiado ? "Copiado!" : "Copiar Card de Resultado"}
        </button>
      )}

      {!ehDupla && conquistasNovas.length > 0 && (
        <div className="max-w-sm mx-auto mb-10">
          <div className="text-[10px] uppercase tracking-wider mb-3" style={{ color: ACCENT }}>Nova{conquistasNovas.length > 1 ? "s" : ""} conquista{conquistasNovas.length > 1 ? "s" : ""}!</div>
          <div className="space-y-2">
            {conquistasNovas.map(id => {
              const c = CONQUISTAS.find(x => x.id === id);
              return (
                <div key={id} className="rounded-lg p-3 text-left" style={{ background: `${ACCENT}15`, border: `1px solid ${ACCENT}40` }}>
                  <div className="font-bold text-sm" style={{ color: ACCENT }}>🏅 {c.nome}</div>
                  <div className="text-xs text-white/50">{c.descricao}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {!ehDupla && !salvo ? (
        <div className="max-w-xs mx-auto mb-10">
          <input value={apelido} onChange={e => setApelido(e.target.value)} maxLength={24}
            className="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2.5 text-white text-sm text-center outline-none focus:border-white/30 mb-3" />
          <button onClick={salvar} disabled={salvando}

            {salvando ? "Salvando..." : `Salvar no Ranking${modoJogo === "desafio" ? " do Dia" : ""}`}
          </button>
        </div>
      ) : !ehDupla && (
        <div className="text-emerald-400 text-sm mb-8">Pontuação salva no ranking!</div>
      )}

      {!ehDupla && (
        <div className="max-w-sm mx-auto mb-10 text-left">
          <div className="text-[10px] uppercase tracking-wider text-white/40 mb-3 text-center">
            {modoJogo === "desafio" ? "Seu Histórico do Desafio de Hoje" : "Seu Histórico"}
          </div>
          {carregando && <div className="text-white/30 text-xs text-center">Carregando...</div>}
          {!carregando && ranking && ranking.length === 0 && <div className="text-white/30 text-xs text-center">Nenhuma campanha salva ainda neste navegador.</div>}
          {!carregando && ranking && ranking.slice(0, 10).map((r, i) => (
            <div key={i} className="flex items-center justify-between border-b border-white/5 py-2 text-sm">
              <span className="text-white/70"><span className="text-white/30 mr-2">{i + 1}º</span>{r.nome}</span>
              <span className="numero" style={{ color: ACCENT }}>{r.pontos}</span>
            </div>
          ))}
        </div>
      )}

      <button onClick={onReiniciar} className="px-10 py-4 rounded-xl font-bold text-lg" style={{ background: ACCENT, color: "#241a05" }}>
        Jogar Novamente
      </button>
    </div>
  );
}

function LibertadoresLendaria() {
  const [modoJogo, setModoJogo] = useState(null); // null | "solo" | "desafio" | "dupla"
  const [faseDupla, setFaseDupla] = useState(null); // null | "draft1" | "draft2"
  const [squadP1, setSquadP1] = useState(null);
  const [nomeP1, setNomeP1] = useState("");
  const [squadP2, setSquadP2] = useState(null);
  const [resultadoDupla, setResultadoDupla] = useState(null);

  const [golsCampanha, setGolsCampanha] = useState(0);
  const [golsSofridosCampanha, setGolsSofridosCampanha] = useState(0);
  const [usouPenaltis, setUsouPenaltis] = useState(false);
  const [margemMaxima, setMargemMaxima] = useState(0);
  const [fechou7x0, setFechou7x0] = useState(false);
  const [historicoResultados, setHistoricoResultados] = useState([]); // 'V' | 'E' | 'D' | 'P' (V nos pênaltis)

  const [fase, setFase] = useState("setup");

  const [nomeTime, setNomeTime] = useState("Seleção do Jogador");
  const [formacaoKey, setFormacaoKey] = useState("4-3-3");
  const [modo, setModo] = useState("normal");
  const [modoCompeticao, setModoCompeticao] = useState("2026");

  const [pool, setPool] = useState([]);
  const [timeAtual, setTimeAtual] = useState(null);
  const [squad, setSquad] = useState({ GK: [], DF: [], MF: [], FW: [] });
  const [rerolls, setRerolls] = useState(3);
  const [rodada, setRodada] = useState(0);

  const [grupoOponentes, setGrupoOponentes] = useState([]);
  const [tabelaGrupo, setTabelaGrupo] = useState(null);
  const [jogosPendentesJogador, setJogosPendentesJogador] = useState([]);

  const [jaEnfrentados, setJaEnfrentados] = useState([]);
  const [faseAtualIdx, setFaseAtualIdx] = useState(0);
  const [adversarioAtual, setAdversarioAtual] = useState(null);

  const [partidaAtual, setPartidaAtual] = useState(null); // {adversario, golsA, golsB, eventos, pen, contexto}
  const [partidaSeq, setPartidaSeq] = useState(0);

  const [statusFinal, setStatusFinal] = useState(null);
  const [faseEliminacao, setFaseEliminacao] = useState("");

  const formacao = FORMACOES[formacaoKey];
  const totalVagas = 1 + formacao.DF + formacao.MF + formacao.FW;

  const forcaJogador = useMemo(() => {
    const total = squad.GK.length + squad.DF.length + squad.MF.length + squad.FW.length;
    if (total < totalVagas) return null;
    return calcularForcaSquad(squad);
  }, [squad, totalVagas]);

  /* ---------- DRAFT ---------- */

  function iniciarDraft() {
    if (modoJogo === "desafio") ativarRngDoDia(); else ativarRngNormal();
    const poolInicial = shuffle(JOGADORES.map((_, i) => i));
    const primeiro = poolInicial.shift();
    setPool(poolInicial);
    setTimeAtual(JOGADORES[primeiro]);
    setSquad({ GK: [], DF: [], MF: [], FW: [] });
    setRerolls(3);
    setRodada(1);
    setGolsCampanha(0);
    setGolsSofridosCampanha(0);
    setUsouPenaltis(false);
    setMargemMaxima(0);
    setFechou7x0(false);
    setHistoricoResultados([]);
    setFase("draft");
  }

  function vagaAberta(squadAtual, posicao) {
    const max = posicao === "GK" ? 1 : formacao[posicao];
    return squadAtual[posicao].length < max;
  }

  function escolherJogador(jogador) {
    if (!vagaAberta(squad, jogador.posicao)) return;
    const novoSquad = { ...squad, [jogador.posicao]: [...squad[jogador.posicao], { ...jogador, origem: timeAtual.time }] };
    setSquad(novoSquad);

    const totalAgora = novoSquad.GK.length + novoSquad.DF.length + novoSquad.MF.length + novoSquad.FW.length;
    if (totalAgora >= totalVagas) { setFase("squad"); return; }
    if (pool.length === 0) { setFase("squad"); return; }
    const novoPool = [...pool];
    const proximo = novoPool.shift();
    setPool(novoPool);
    setTimeAtual(JOGADORES[proximo]);
    setRodada(r => r + 1);
  }

  function resortear() {
    if (rerolls <= 0 || pool.length === 0) return;
    const novoPool = [...pool];
    const proximo = novoPool.shift();
    setPool(novoPool);
    setTimeAtual(JOGADORES[proximo]);
    setRerolls(r => r - 1);
  }

  /* ---------- APÓS VER O TIME MONTADO (ramifica pro modo dupla) ---------- */

  function aposVerSquad() {
    if (modoJogo === "dupla") {
      if (faseDupla === "draft1") {
        setSquadP1(squad);
        setNomeP1(nomeTime);
        setFaseDupla("draft2");
        setNomeTime("Time 2");
        setFase("setup");
        return;
      }
      if (faseDupla === "draft2") {
        setSquadP2(squad);
        iniciarPartidaDupla(squadP1, squad, nomeP1, nomeTime);
        return;
      }
    }
    sortearGrupo();
  }

  function iniciarPartidaDupla(sqA, sqB, nomeA, nomeB) {
    const forcaA = calcularForcaSquad(sqA);
    const forcaB = calcularForcaSquad(sqB);
    const { golsA, golsB } = simularPartida(forcaA, forcaB);
    let pen = null;
    if (golsA === golsB) {
      const gkA = sqA.GK[0] ? sqA.GK[0].overall : 70;
      const gkB = sqB.GK[0] ? sqB.GK[0].overall : 70;
      pen = penaltis(forcaA.ataque + forcaA.defesa + gkA * 0.3, forcaB.ataque + forcaB.defesa + gkB * 0.3);
    }
    const eventos = gerarEventosPartida(golsA, golsB, sqA, sqB);
    setPartidaAtual({ nomeA, nomeB, golsA, golsB, eventos, pen, contexto: "dupla" });
    setPartidaSeq(s => s + 1);
  }

  /* ---------- GRUPO (3 adversários aleatórios, sem seguir grupos oficiais) ---------- */

  function sortearGrupo() {
    const pool3 = poolOponentes(modoCompeticao);
    const oponentes = shuffle(pool3).slice(0, 3);
    setGrupoOponentes(oponentes);

    const nomes = [nomeTime, ...oponentes.map(o => o.nome)];
    const tabela = novaTabela(nomes);

    todosConfrontos(nomes).forEach(([a, b]) => {
      if (a === nomeTime || b === nomeTime) return;
      const ta = oponentes.find(o => o.nome === a), tb = oponentes.find(o => o.nome === b);
      const ida = simularPartida(ta, tb);
      aplicarResultado(tabela, a, b, ida.golsA, ida.golsB);
      const volta = simularPartida(tb, ta);
      aplicarResultado(tabela, b, a, volta.golsA, volta.golsB);
    });

    const pendentes = [
      ...oponentes.map(op => ({ id: `${op.nome}-ida`, adversario: op.nome, perna: "Ida" })),
      ...oponentes.map(op => ({ id: `${op.nome}-volta`, adversario: op.nome, perna: "Volta" })),
    ];

    setTabelaGrupo(tabela);
    setJogosPendentesJogador(pendentes);
    setFase("grupo");
  }

  function iniciarPartidaGrupo(pendente) {
    const oponente = grupoOponentes.find(o => o.nome === pendente.adversario);
    const { golsA, golsB } = simularPartida({ ataque: forcaJogador.ataque, defesa: forcaJogador.defesa }, oponente);
    const eventos = gerarEventosPartida(golsA, golsB, squad);
    setPartidaAtual({ adversario: oponente, golsA, golsB, eventos, pen: null, contexto: "grupo", pendenteId: pendente.id });
    setPartidaSeq(s => s + 1);
  }

  /* ---------- MATA-MATA (sorteio livre a cada rodada, sem repetir adversário) ---------- */

  function irParaMataMata() {
    const ordenada = ordenarTabela(tabelaGrupo);
    const top2 = ordenada.slice(0, 2).map(t => t.nome);
    if (!top2.includes(nomeTime)) {
      setStatusFinal("eliminado");
      setFaseEliminacao("Fase de Grupos");
      setFase("final");
      return;
    }
    const enfrentados = grupoOponentes.map(o => o.nome);
    setJaEnfrentados(enfrentados);
    setFaseAtualIdx(0);
    setAdversarioAtual(sortearAdversarioKnockout(modoCompeticao, 0, enfrentados));
    setFase("knockout");
  }

  function iniciarPartidaKnockout() {
    const { golsA, golsB } = simularPartida({ ataque: forcaJogador.ataque, defesa: forcaJogador.defesa }, adversarioAtual);
    let pen = null;
    if (golsA === golsB) {
      const gkForca = squad.GK[0] ? squad.GK[0].overall : 70;
      pen = penaltis(forcaJogador.ataque + forcaJogador.defesa + gkForca * 0.3, adversarioAtual.ataque + adversarioAtual.defesa);
    }
    const eventos = gerarEventosPartida(golsA, golsB, squad);
    setPartidaAtual({ adversario: adversarioAtual, golsA, golsB, eventos, pen, contexto: "knockout" });
    setPartidaSeq(s => s + 1);
  }

  function onContinuarPartida({ golsA, golsB, pen }) {
    const p = partidaAtual;

    if (p.contexto === "dupla") {
      const venceu = pen ? pen.a > pen.b : golsA > golsB;
      const empate = !pen && golsA === golsB;
      setResultadoDupla({ nomeA: p.nomeA, nomeB: p.nomeB, golsA, golsB, pen, vencedor: empate ? null : (venceu ? p.nomeA : p.nomeB) });
      setPartidaAtual(null);
      setFase("resultadoDupla");
      return;
    }

    if (p.contexto === "grupo") {
      setGolsCampanha(g => g + golsA);
      setGolsSofridosCampanha(g => g + golsB);
      setMargemMaxima(m => Math.max(m, golsA - golsB));
      if (golsA === 7 && golsB === 0) setFechou7x0(true);
      setHistoricoResultados(h => [...h, golsA > golsB ? "V" : golsA < golsB ? "D" : "E"]);
      const novaTab = {};
      Object.keys(tabelaGrupo).forEach(k => { novaTab[k] = { ...tabelaGrupo[k] }; });
      aplicarResultado(novaTab, nomeTime, p.adversario.nome, golsA, golsB);
      setTabelaGrupo(novaTab);
      setJogosPendentesJogador(pend => pend.filter(x => x.id !== p.pendenteId));
      setPartidaAtual(null);
      return;
    }

    setGolsCampanha(g => g + golsA);
    setGolsSofridosCampanha(g => g + golsB);
    setMargemMaxima(m => Math.max(m, golsA - golsB));
    if (golsA === 7 && golsB === 0) setFechou7x0(true);
    const venceu = pen ? pen.a > pen.b : golsA > golsB;
    if (pen) setUsouPenaltis(true);
    setHistoricoResultados(h => [...h, venceu ? (pen ? "P" : "V") : "D"]);
    setPartidaAtual(null);

    if (!venceu) {
      setStatusFinal("eliminado");
      setFaseEliminacao(FASES_ELIMINATORIAS[faseAtualIdx]);
      setFase("final");
      return;
    }

    if (faseAtualIdx === FASES_ELIMINATORIAS.length - 1) {
      setStatusFinal("campeao");
      setFase("final");
      return;
    }

    const novosEnfrentados = [...jaEnfrentados, p.adversario.nome];
    setJaEnfrentados(novosEnfrentados);
    const novoIdx = faseAtualIdx + 1;
    setFaseAtualIdx(novoIdx);
    setAdversarioAtual(sortearAdversarioKnockout(modoCompeticao, novoIdx, novosEnfrentados));
  }

  function reiniciar() {
    setModoJogo(null);
    setFaseDupla(null);
    setSquadP1(null);
    setNomeP1("");
    setSquadP2(null);
    setResultadoDupla(null);
    setGolsCampanha(0);
    setGolsSofridosCampanha(0);
    setUsouPenaltis(false);
    setMargemMaxima(0);
    setFechou7x0(false);
    setHistoricoResultados([]);
    setFase("setup");
    setNomeTime("Seleção do Jogador");
    setFormacaoKey("4-3-3");
    setModo("normal");
    setModoCompeticao("2026");
    setSquad({ GK: [], DF: [], MF: [], FW: [] });
    setGrupoOponentes([]);
    setTabelaGrupo(null);
    setJogosPendentesJogador([]);
    setJaEnfrentados([]);
    setFaseAtualIdx(0);
    setAdversarioAtual(null);
    setStatusFinal(null);
    setPartidaAtual(null);
  }

  /* ============================== RENDER ============================== */

  return (
    <div className="min-h-full w-full" style={{ background: "radial-gradient(ellipse at top, #14251c 0%, #0a1410 55%, #060b08 100%)" }}>
      <style>{`
        .numero { font-family: 'Arial Narrow', Impact, sans-serif; font-weight: 900; letter-spacing: -0.02em; }
        .titulo { font-family: Impact, 'Arial Narrow', sans-serif; letter-spacing: 0.02em; text-transform: uppercase; }
        @keyframes cartaIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .carta-jogador { animation: cartaIn .35s ease both; }
        .fundo-textura { background-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.035) 0%, transparent 60%); }
      `}</style>

      <div className="max-w-3xl mx-auto px-4 py-8 fundo-textura">
        {modoJogo === null && <TelaModoJogo onEscolher={m => { setModoJogo(m); if (m === "dupla") { setFaseDupla("draft1"); setNomeTime("Time 1"); } }} />}

        {modoJogo !== null && fase === "setup" && (
          <TelaSetup
            nomeTime={nomeTime} setNomeTime={setNomeTime}
            formacaoKey={formacaoKey} setFormacaoKey={setFormacaoKey}
            modo={modo} setModo={setModo}
            modoCompeticao={modoCompeticao} setModoCompeticao={setModoCompeticao}
            onIniciar={iniciarDraft}
            ocultarModoCompeticao={modoJogo === "dupla"}
            tituloEtapa={
              modoJogo === "dupla" ? (faseDupla === "draft1" ? "Jogador 1: monte seu time" : "Jogador 2: monte seu time") :
              modoJogo === "desafio" ? "Desafio do Dia — mesmo sorteio pra todo mundo hoje" : undefined
            }
          />
        )}

        {modoJogo !== null && fase === "draft" && (
          <TelaDraft
            modo={modo} timeAtual={timeAtual} squad={squad} formacao={formacao}
            rerolls={rerolls} rodada={rodada} totalVagas={totalVagas}
            vagaAberta={vagaAberta} onEscolher={escolherJogador} onResortear={resortear}
          />
        )}

        {modoJogo !== null && fase === "squad" && (
          <TelaSquad nomeTime={nomeTime} squad={squad} forca={forcaJogador} onContinuar={aposVerSquad} />
        )}

        {modoJogo !== null && fase === "grupo" && !partidaAtual && (
          <TelaGrupo
            nomeTime={nomeTime} modoCompeticao={modoCompeticao} grupoOponentes={grupoOponentes} tabela={tabelaGrupo}
            pendentes={jogosPendentesJogador} onJogar={iniciarPartidaGrupo} onAvancar={irParaMataMata}
          />
        )}

        {modoJogo !== null && fase === "knockout" && !partidaAtual && (
          <TelaKnockout nomeTime={nomeTime} modoCompeticao={modoCompeticao} faseNome={FASES_ELIMINATORIAS[faseAtualIdx]} adversario={adversarioAtual} onJogar={iniciarPartidaKnockout} />
        )}

        {partidaAtual && partidaAtual.contexto !== "dupla" && (
          <PartidaAoVivo
            key={partidaSeq}
            nomeTime={nomeTime}
            adversarioNome={partidaAtual.adversario.nome}
            adversarioEhJogador={false}
            squadA={squad}
            golsA={partidaAtual.golsA}
            golsB={partidaAtual.golsB}
            eventos={partidaAtual.eventos}
            pen={partidaAtual.pen}
            onContinuar={onContinuarPartida}
          />
        )}

        {partidaAtual && partidaAtual.contexto === "dupla" && (
          <PartidaAoVivo
            key={partidaSeq}
            nomeTime={partidaAtual.nomeA}
            adversarioNome={partidaAtual.nomeB}
            adversarioEhJogador={true}
            golsA={partidaAtual.golsA}
            golsB={partidaAtual.golsB}
            eventos={partidaAtual.eventos}
            pen={partidaAtual.pen}
            onContinuar={onContinuarPartida}
          />
        )}

        {fase === "resultadoDupla" && resultadoDupla && (
          <TelaResultadoDupla resultado={resultadoDupla} onReiniciar={reiniciar} />
        )}

        {fase === "final" && (
          <TelaFinal
            nomeTime={nomeTime} status={statusFinal} faseEliminacao={faseEliminacao}
            golsCampanha={golsCampanha} golsSofridosCampanha={golsSofridosCampanha}
            usouPenaltis={usouPenaltis} margemMaxima={margemMaxima} fechou7x0={fechou7x0}
            historicoResultados={historicoResultados} rerolls={rerolls} squad={squad}
            modo={modo} modoJogo={modoJogo} modoCompeticao={modoCompeticao}
            onReiniciar={reiniciar}
          />
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(LibertadoresLendaria));

</script>
</body>
</html>
